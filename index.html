<script type="module">
/* ═══ LIAR'S DICE · a Multiplayer Agent starter ═══════════════════════════════════════════
 * Bluff about dice nobody else can see. Turn-based, 2–6 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ seats, dice, timers, how the bots bluff, colors
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED CUPS ... the Seal helper: your dice are encrypted so only you can see them
 *   RULES ......... what counts toward a bid, what a legal raise is, the odds (for bots)
 *   TABLE (HOST) .. seats, rolling, bids, "liar" calls, losing dice, bots, the turn timer,
 *                   and taking over as a new host. Only the host writes the shared fields.
 *   MY CUP ........ reading my sealed dice, bidding, calling liar, re-sending to a new host
 *   SCENE ......... renderer, the lamp over the table, the tavern table and floor
 *   DICE & CUPS ... dice and cup models, each seat's cup, dice, name tag and speech bubble
 *   HUD & RESULTS . the status line, the bid panel, the results card, leaderboard, sounds
 *   INPUT / LOOP .. buttons, keys, the camera, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The table lives in shared fields only the HOST writes: `game` (one JSON field: id, v,
 *     phase, seats, dice left per seat, round, turn, the current bid, recent bids, the last
 *     "liar" call, every die once revealed, timers, the winner) and `cups` (each human's
 *     dice this round, SEALED to that player, so only they can see them; the host rolls, so
 *     it can too).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s).
 *     It holds every die in its own memory and only reveals them when someone calls liar.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `pk` (public key), `hb`.
 *   - Intents to the host: "bid" {g, t, c, f}, "liar" {g, t}, "again" {g}. `t` counts every
 *     action, so an old or double intent is ignored.
 *   - When the host changes, every player re-sends its own dice sealed to the new host
 *     ("mydice"). The bots' dice were only in the old host's memory, so they are re-rolled.
 *   - Timers are timestamps: endsAt (the roll and the reveal), turnEnds (then the host bids
 *     for you).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for each game a player wins, shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,               // bots fill the table up to this many players (2 to 6)
  maxSeats: 6,            // more people than this watch until a seat frees up
  dice: 5,                // dice each player starts with
  wildOnes: true,         // ones count as every face (so nobody bids on ones)
  rollMs: 1600,           // the cups rattle this long at the start of a round
  turnMs: 30000,          // time to bid before the host bids for you
  revealMs: 5500,         // the cups stay up this long after a "liar" call
  overMs: 15000,          // the results card shows this long, then a new game starts
  botMs: [1300, 2800],    // how long a bot thinks
  botDoubt: 0.32,         // a bot calls liar when it thinks the bid is less likely than this
  botBluff: 0.15,         // chance a bot bids for show instead of for odds
  seatGraceMs: 8000,      // a player silent this long hands its seat (and dice) to a bot
  rejoinMs: 3000,         // a new host waits this long for players to re-send their dice
  board: "wins",          // leaderboard name
  felt: "#1d5741", wood: "#5c3520", leather: "#7b4a2b", room: "#130c08",
};
const BOT_NAMES = ["Old Salt", "Mags", "Barnaby", "One-Eye", "Rosie", "Captain Pip"];
const COLORS = ["#ff6b5e", "#4dabf7", "#ffd43b", "#69db7c", "#c08cff", "#ff9f43", "#f783ac", "#3bc9db"];
const NAME_A = ["Lucky", "Sly", "Bold", "Shifty", "Jolly", "Salty"], NAME_B = ["Gull", "Fox", "Otter", "Crab", "Parrot", "Eel"];
const WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'liars-dice',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));
/** Still in the room and heard from within the seat grace time. */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);
const playerName = (id) => (id === net.sessionId ? myName : String(S.entities.players[id]?.n || "Player")).slice(0, 14);
const playerColor = (id) => (id === net.sessionId ? myColor : S.entities.players[id]?.c || "#ccc");
const pkOf = (id) => (id === net.sessionId ? Seal.pub : S.entities.players[id]?.pk);

// ── SEALED CUPS ─────────────────────────────────────────────────────────────────────
// Everything in room state reaches every client, so your dice are written SEALED: encrypted so
// only you can open them. Each player publishes a public key in its own entity (`pk`); the host
// seals each player's dice to that key and writes the boxes into the shared `cups` field.
//   - The host rolls, so the host can see every die. Fine for friends, not cheat-proof.
//   - A new host can't open boxes the old host sealed, so every player re-sends its own dice
//     to the new host (sealed, with mp.send).
//   - crypto.subtle needs https or localhost. Offline you are the host and there is nobody to
//     hide from, so seal()/open() pass the value through.
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on || !toPub || !this.pair) return "p:" + JSON.stringify(value);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);
      return JSON.parse(new TextDecoder().decode(pt));
    } catch { return null; }
  },
};

// ── RULES ───────────────────────────────────────────────────────────────────────────
// A bid {c, f} says: "on the whole table there are at least c dice showing f" (ones count as any face).
const minFace = () => (CONFIG.wildOnes ? 2 : 1);
const counts = (d, f) => d === f || (CONFIG.wildOnes && d === 1);
const roll = () => 1 + Math.floor(Math.random() * 6);
/** A raise needs more dice, or the same number of a higher face. */
const beats = (bid, c, f) => !bid || c > bid.c || (c === bid.c && f > bid.f);
const total = (g) => g.dice.reduce((a, b) => a + b, 0);
/** Chance that at least k of n hidden dice show the face (each counts with probability p). */
function atLeast(n, p, k) {
  if (k <= 0) return 1;
  if (k > n) return 0;
  let sum = 0, c = 1;
  for (let i = 0; i <= n; i++) { if (i >= k) sum += c * p ** i * (1 - p) ** (n - i); c = (c * (n - i)) / (i + 1); }
  return sum;
}
const faceWord = (c, f) => `${WORDS[c] || c} ${f}${c === 1 ? "" : "s"}`;

// ── TABLE (HOST) ────────────────────────────────────────────────────────────────────
// The host's private memory: every die this round (`dice[seat]`), the boxes, intents in line.
const host = { last: null, ready: false, since: 0, busy: false, dice: [], r: -1, boxes: {}, think: null, inbox: [], known: new Map() };
const gameMemo = { raw: undefined, g: null };
/** The game as state has it, or the host's own newer write that hasn't come back yet. */
function game() {
  if (gameMemo.raw !== S.shared.game) { gameMemo.raw = S.shared.game; gameMemo.g = parse(S.shared.game, null); }
  const g = gameMemo.g;
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const seatOf = (g, id) => (g ? g.seats.findIndex((s) => s.i === id) : -1);
const canSit = (id) => net.offline || !Seal.on || (id === net.sessionId ? !!Seal.pub : !!S.entities.players[id]?.pk);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
/** The next seat after `s` that still has dice. */
const nextIn = (g, s, dice = g.dice) => { for (let k = 1; k <= g.seats.length; k++) { const i = (s + k) % g.seats.length; if (dice[i] > 0) return i; } return s; };

/** Seal the listed seats' dice to their owners into `cups`, then write the game. */
async function commit(g, sealSeats = []) {
  for (const i of new Set(sealSeats)) {
    const s = g.seats[i];
    if (!s || s.b || !host.dice[i] || (!pkOf(s.i) && Seal.on && !net.offline)) continue; // never write dice in the clear
    host.boxes[s.i] = await Seal.seal(pkOf(s.i), { g: g.id, r: g.r, d: host.dice[i] });
  }
  if (sealSeats.length) net.setShared("cups", JSON.stringify({ g: g.id, r: g.r, pk: Seal.pub, box: host.boxes }));
  return writeGame(g);
}
/** A new game: whoever just played keeps their seat, then whoever is waiting, then bots. */
function newGame(prev) {
  const live = humans().filter(canSit);
  const keep = prev ? prev.seats.filter((s) => !s.b && live.includes(s.i)).map((s) => s.i) : [];
  const ids = [...keep, ...live.filter((id) => !keep.includes(id))].slice(0, CONFIG.maxSeats);
  const seats = ids.map((id) => ({ i: id, n: playerName(id), c: playerColor(id) }));
  for (let k = 0; seats.length < Math.max(2, Math.min(CONFIG.maxSeats, CONFIG.seats)); k++) {
    const c = COLORS.find((x) => !seats.some((s) => s.c === x)) || COLORS[k], n = BOT_NAMES.find((x) => !seats.some((s) => s.n === x)) || "Bot";
    seats.push({ i: "bot" + k, n, c, b: 1 });
  }
  const g = { id: (prev?.id ?? 0) + 1, ph: "roll", seats, dice: seats.map(() => CONFIG.dice), r: 0, turn: 0, t: 0, bid: null, hist: [], call: null, reveal: null, win: -1, ready: [] };
  return startRound(g, Math.floor(Math.random() * seats.length));
}
/** A round: waiting players take bot seats, everyone still in rolls (sealed), the cups rattle. */
function startRound(g, starter) {
  const waiting = humans().filter((id) => canSit(id) && seatOf(g, id) < 0), seats = g.seats.slice();
  if (!ATTRACT) seats.forEach((s, i) => { if (s.b && waiting.length && g.dice[i] > 0) { const id = waiting.shift(); seats[i] = { i: id, n: playerName(id), c: playerColor(id) }; } });
  host.dice = seats.map((_, i) => Array.from({ length: g.dice[i] }, roll));
  host.r = g.r + 1; host.boxes = {}; host.think = null;
  const t = Date.now();
  return commit({ ...g, seats, ph: "roll", r: g.r + 1, turn: starter, t: g.t + 1, bid: null, hist: [], call: null, reveal: null, endsAt: t + CONFIG.rollMs,
    turnAt: 0, turnEnds: 0, host: net.sessionId }, seats.map((_, i) => i));
}
function placeBid(g, i, c, f) {
  if (g.ph !== "bid" || g.turn !== i || !Number.isInteger(c) || !Number.isInteger(f) || f < minFace() || f > 6 || c < 1 || c > total(g) || !beats(g.bid, c, f)) return;
  const t = Date.now();
  return writeGame({ ...g, bid: { s: i, c, f }, hist: [...g.hist, [i, c, f]].slice(-8), turn: nextIn(g, i), t: g.t + 1, turnAt: t, turnEnds: t + CONFIG.turnMs });
}
/** "Liar!": lift every cup, count the dice; whoever was wrong loses one. */
function callLiar(g, i) {
  if (g.ph !== "bid" || g.turn !== i || !g.bid) return;
  const n = host.dice.flat().filter((d) => counts(d, g.bid.f)).length, lose = n >= g.bid.c ? i : g.bid.s, t = Date.now();
  return writeGame({ ...g, ph: "reveal", t: g.t + 1, call: { by: i, s: g.bid.s, c: g.bid.c, f: g.bid.f, n, lose }, reveal: host.dice.map((d) => d.slice()), endsAt: t + CONFIG.revealMs });
}
/** After a reveal: the loser drops a die; the last player with dice wins; else the loser starts the next round. */
function afterReveal(g) {
  const dice = g.dice.slice(), lose = g.call.lose;
  dice[lose] = Math.max(0, dice[lose] - 1);
  const left = dice.map((n, i) => (n > 0 ? i : -1)).filter((i) => i >= 0);
  if (left.length <= 1) return writeGame({ ...g, dice, ph: "over", win: left[0] ?? -1, t: g.t + 1, endsAt: Date.now() + CONFIG.overMs, ready: [] });
  return startRound({ ...g, dice }, dice[lose] > 0 ? lose : nextIn(g, lose, dice));
}
/** A bot's move (also made for a human whose time ran out): call liar on an unlikely bid, else raise. */
function botMove(g, i) {
  const mine = host.dice[i] || [], hidden = total(g) - mine.length, p = CONFIG.wildOnes ? 1 / 3 : 1 / 6;
  const have = (f) => mine.filter((d) => counts(d, f)).length;
  const chance = (c, f) => atLeast(hidden, p, c - have(f));

}
function drawTag(x, w, h, s, n, turn) {

  x.strokeStyle = s.c; x.lineWidth = 6; x.stroke();

/** Rebuild a seat's dice when the faces it should show change; at a reveal, light the ones that count. */
function syncDice(v, faces, g, now, mine) {

  if (v.diceKey !== key) {
    v.diceKey = key;
    for (const d of v.dice) v.root.remove(d);
    v.dice = faces.map((f, k) => { const d = makeDie(f, ((k * 1.7) % 0.5) - 0.25); const [x, z] = diePos(k, faces.length, mine); d.position.set(x, DIE / 2, z); v.root.add(d); d.userData.born = now + k * 60; return d; });

// A die that flies off the table when a player loses it.
const flying = [];
function loseDie(i, now) {
  const v = views[i];
  if (!v) return;
  const d = makeDie(1 + Math.floor(Math.random() * 6), 0), p = new THREE.Vector3(0, DIE / 2, 0).applyMatrix4(v.root.matrixWorld);

}
function tickFlying(now) {

    f.d.position.set(f.from.x * (1 + t * 0.8), f.from.y + Math.sin(t * Math.PI) * 2.2 + t * 1.5, f.from.z * (1 + t * 0.8));
    f.d.rotation.set(t * 9, t * 6, t * 4); f.d.scale.setScalar(1 - t * 0.7);
  }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
for (let f = minFace(); f <= 6; f++) $("faces").insertAdjacentHTML("beforeend", `<button data-f="${f}" aria-label="${f}s">${faceImg(f)}</button>`);
const nameOfSeat = (g, i) => (i === seatOf(g, net.sessionId) && !ATTRACT ? "You" : esc(g.seats[i].n));
const bidHtml = (c, f) => `${c} × ${faceImg(f)}`;
function hud(g) {
  const i = seatOf(g, net.sessionId), t = Date.now(), b = g.bid, myT = myTurn(g) && !ATTRACT;
  let st = "", sub = "";
  if (g.ph === "roll") { st = g.r === 1 ? "Shake the cups!" : `Round ${g.r}`; sub = i >= 0 && g.dice[i] > 0 && !ATTRACT ? "Your dice are under your cup. Only you can see them." : ""; }
  else if (g.ph === "bid") {
    st = myT ? (b ? `${nameOfSeat(g, b.s)} bid ${bidHtml(b.c, b.f)} · raise or call liar` : "Your bid · you start") : b ? `${nameOfSeat(g, b.s)} bid ${bidHtml(b.c, b.f)}` : `${nameOfSeat(g, g.turn)} starts`;
    sub = myT ? `${Math.max(0, Math.ceil((g.turnEnds - t) / 1000))}s · bid on ALL ${total(g)} dice on the table${CONFIG.wildOnes ? " · ones are wild" : ""}`
      : i >= 0 && g.dice[i] > 0 && !ATTRACT ? `${nameOfSeat(g, g.turn)} is thinking…` : i < 0 && !ATTRACT ? "You're watching. You'll get a seat when a bot's comes free." : "";
  } else if (g.ph === "reveal" && g.call) {
    const c = g.call, ok = c.n >= c.c;
    st = `${nameOfSeat(g, c.by)} called liar! There ${c.n === 1 ? "was" : "were"} ${c.n} × ${faceImg(c.f)}`;
    sub = `${nameOfSeat(g, c.s)} bid ${c.c}, so ${ok ? `the bid was right: ${nameOfSeat(g, c.by)}` : `it was a bluff: ${nameOfSeat(g, c.s)}`} ${c.lose === i && !ATTRACT ? "lose" : "loses"} a die.${CONFIG.wildOnes ? " (Ones count.)" : ""}`;
  } else if (g.ph === "over") { st = g.win === i && !ATTRACT ? "You win!" : g.win >= 0 ? `${esc(g.seats[g.win].n)} wins!` : "Game over"; }
  if (ATTRACT) sub = "";
  if ($("status").innerHTML !== st) $("status").innerHTML = st;
  if ($("sub").innerHTML !== sub) $("sub").innerHTML = sub;
  const hist = !ATTRACT && (g.ph === "bid" || g.ph === "reveal") ? g.hist.slice(-5).map(([s, c, f]) => `<div>${nameOfSeat(g, s)}: ${bidHtml(c, f)}</div>`).join("") : "";
  if ($("hist").innerHTML !== hist) $("hist").innerHTML = hist;
  $("panel").hidden = !myT;
  if (myT) { suggest(g); renderPanel(g); }
  const n = livePlayers().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the table" : ""}`;
  results(g);
}
function renderPanel(g) {
  $("count").textContent = pickBid.c;
  for (const b of $("faces").children) b.classList.toggle("on", +b.dataset.f === pickBid.f);
  const ok = beats(g.bid, pickBid.c, pickBid.f);
  const label = `Bid ${bidHtml(pickBid.c, pickBid.f)}`;
  $("bidBtn").disabled = !ok; if ($("bidBtn").innerHTML !== label) $("bidBtn").innerHTML = label;
  $("liarBtn").disabled = !g.bid; $("minus").disabled = pickBid.c <= 1; $("plus").disabled = pickBid.c >= total(g);
}
let board = null, resultsFor = -1;
function results(g) {
  $("over").hidden = g.ph !== "over" || ATTRACT;
  if (g.ph !== "over") return;
  $("oNext").textContent = `Next game in ${Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000))}s`;
  $("again").textContent = g.ready.includes(net.sessionId) ? "Ready ✓" : "Play again";
  if (resultsFor === g.id) return;
  resultsFor = g.id;
  const i = seatOf(g, net.sessionId), won = i >= 0 && g.win === i;
  $("oTitle").textContent = won ? "You win!" : g.win >= 0 ? `${g.seats[g.win].n} wins` : "Game over";
  $("oSub").textContent = won ? "Last one with dice. Nobody saw through you." : i >= 0 ? "Your cup ran dry this time." : "";
  $("again").hidden = i < 0;
  const list = $("board");
  if (!board) { list.innerHTML = "<li class='note'>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class='note'>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li class='note'>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li class='note'>Couldn't load the leaderboard.</li>"; });
}
/** Sounds, bubbles and flying dice when something lands in state (effects only: nothing here decides anything). */
let seenKey = "", seenDice = null, bidPopAt = -1e9, callAt = -1e9;
function effects(g, now) {
  const key = g.id + ":" + g.t, first = !seenKey;
  if (key === seenKey) return;
  seenKey = key;
  const prevDice = seenDice; seenDice = { g: g.id, d: g.dice.slice() };
  if (first) return;
  if (prevDice && prevDice.g === g.id) g.dice.forEach((n, i) => { if (n < prevDice.d[i]) { loseDie(i, now); sound(110, 0.25, "sawtooth"); } });
  if (g.ph === "roll") rattle();
  const last = g.hist[g.hist.length - 1];
  if (g.ph === "bid" && last && g.bid && last[0] === g.bid.s && last[1] === g.bid.c && last[2] === g.bid.f && bubbleFor !== key) {
    bubbleFor = key; bidPopAt = now;
    const v = views[last[0]];
    for (const o of views) if (o !== v && now - o.bubbleAt < BUBBLE_MS - 300) o.bubbleAt = now - BUBBLE_MS + 300; // older bubbles fade out
    if (v) { v.bubbleAt = now; paintLabel(v.bubble, "b" + key, (x, w, h) => drawBubble(x, w, h, last[1], last[2])); }
    sound(520 + last[2] * 40, 0.08);
  }
  if (g.ph === "reveal" && g.call) {
    callAt = now;
    const v = views[g.call.by];
    if (v) { v.bubbleAt = now; paintLabel(v.bubble, "liar" + key, (x, w, h) => drawBubble(x, w, h, 0, 0)); }
    paintLabel(callTag, "c" + key, (x, w, h) => { x.font = "900 120px system-ui, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.lineWidth = 14; x.strokeStyle = "#2a0705"; x.strokeText(`${g.call.n} × `, w / 2 - 50, h / 2); x.fillStyle = g.call.n >= g.call.c ? "#9dff8a" : "#ff6a5e"; x.fillText(`${g.call.n} × `, w / 2 - 50, h / 2); x.drawImage(faceCanvas[g.call.f], w / 2 + 70, h / 2 - 55, 110, 110); });
    sound(90, 0.45, "square"); setTimeout(() => sound(g.call.n >= g.call.c ? 660 : 200, 0.3), 450);
  }
  if (g.ph === "over" && g.win >= 0) { confetti(); sound(784, 0.4); }
}
let bubbleFor = "";
const faceCanvas = [0, 1, 2, 3, 4, 5, 6].map((v) => { if (!v) return null; const c = document.createElement("canvas"); c.width = c.height = 128; paintFace(c.getContext("2d"), 128, v); return c; });
/** A speech bubble: "4 × [die]", or "LIAR!" when count is 0. */
function drawBubble(x, w, h, c, f) {
  x.fillStyle = c ? "#fff8ea" : "#ff4b3e"; x.beginPath(); x.roundRect(8, 8, w - 16, h - 34, 26); x.fill();
  x.beginPath(); x.moveTo(w / 2 - 16, h - 28); x.lineTo(w / 2, h - 4); x.lineTo(w / 2 + 16, h - 28); x.fill();
  x.textAlign = "center"; x.textBaseline = "middle";
  if (!c) { x.fillStyle = "#fff"; x.font = "900 64px system-ui, sans-serif"; x.fillText("LIAR!", w / 2, (h - 26) / 2 + 4); return; }
  x.fillStyle = "#2a1a10"; x.font = "900 62px system-ui, sans-serif"; x.fillText(`${c} ×`, w / 2 - 40, (h - 26) / 2 + 4);
  x.drawImage(faceCanvas[f], w / 2 + 30, (h - 26) / 2 - 36, 72, 72);
}
// Confetti on a win, drawn on a canvas over the table.
const fx = $("fx"), fxc = fx.getContext("2d"), bits = [];
function confetti() { for (let k = 0; k < 120; k++) bits.push({ x: innerWidth / 2, y: innerHeight * 0.45, vx: (Math.random() - 0.5) * 600, vy: -250 - Math.random() * 450, c: ["#ffd25a", "#ff6b5e", "#69db7c", "#4dabf7", "#fff"][k % 5], r: Math.random() * 6, life: 1.8 }); }
function drawFx(dt) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (fx.width !== Math.round(innerWidth * dpr)) { fx.width = Math.round(innerWidth * dpr); fx.height = Math.round(innerHeight * dpr); }
  fxc.setTransform(dpr, 0, 0, dpr, 0, 0); fxc.clearRect(0, 0, innerWidth, innerHeight);
  for (let k = bits.length - 1; k >= 0; k--) {
    const b = bits[k]; b.life -= dt; b.vy += 700 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r += dt * 8;
    if (b.life <= 0) { bits.splice(k, 1); continue; }
    fxc.save(); fxc.translate(b.x, b.y); fxc.rotate(b.r); fxc.fillStyle = b.c; fxc.globalAlpha = Math.min(1, b.life); fxc.fillRect(-4, -2.5, 8, 5); fxc.restore();
  }
}
let actx = null; // sounds start after the first tap or key (browsers require it)
function unlockAudio() { if (!actx && !ATTRACT) try { actx = new AudioContext(); } catch {} }
function sound(freq, len, type = "triangle") {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  gn.gain.setValueAtTime(0.1, t); gn.gain.exponentialRampToValueAtTime(0.001, t + len + 0.08);
  o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + len + 0.1);

/** The cups rattling: short bursts of noise. */
function rattle() {
  if (!actx) return;
  const buf = actx.createBuffer(1, actx.sampleRate * 0.05, actx.sampleRate), d = buf.getChannelData(0);
  for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
  for (let n = 0; n < 12; n++) { const s = actx.createBufferSource(), gn = actx.createGain(); s.buffer = buf; gn.gain.value = 0.12; s.connect(gn).connect(actx.destination); s.start(actx.currentTime + n * 0.11 + Math.random() * 0.04); }
}

// ── INPUT / LOOP ────────────────────────────────────────────────────────────────────
function changeBid(dc, f) {
  const g = game();
  if (!g || !myTurn(g)) return;
  if (f) pickBid.f = f;
  pickBid.c = Math.max(1, Math.min(total(g), pickBid.c + dc));
  sound(400 + pickBid.c * 20, 0.04); renderPanel(g);
}
function sendBid() { const g = game(); if (g && myTurn(g) && beats(g.bid, pickBid.c, pickBid.f)) { unlockAudio(); act("bid", { c: pickBid.c, f: pickBid.f }); $("panel").hidden = true; } }
function sendLiar() { const g = game(); if (g && myTurn(g) && g.bid) { unlockAudio(); act("liar", {}); $("panel").hidden = true; } }
$("minus").addEventListener("click", () => changeBid(-1));
$("plus").addEventListener("click", () => changeBid(1));
$("faces").addEventListener("click", (e) => { const b = e.target.closest("button[data-f]"); if (b) changeBid(0, +b.dataset.f); });
$("bidBtn").addEventListener("click", sendBid);
$("liarBtn").addEventListener("click", sendLiar);
$("again").addEventListener("click", () => act("again", {}));
addEventListener("pointerdown", unlockAudio);
addEventListener("keydown", (e) => {
  if (e.target === $("name")) return;
  unlockAudio();
  const k = e.key.toLowerCase();
  if (k === "arrowup" || k === "+" || k === "=") changeBid(1);
  else if (k === "arrowdown" || k === "-") changeBid(-1);
  else if (k >= String(minFace()) && k <= "6" && k.length === 1) changeBid(0, +k);
  else if (k === "enter") sendBid();
  else if (k === "l") sendLiar();
  else return;
  e.preventDefault();
});
$("name").value = myName;
$("name").addEventListener("change", () => {
  myName = $("name").value.trim().slice(0, 14) || myName;
  try { localStorage.setItem("mpa-name", myName); } catch {}
  net && net.me.set("n", myName);
});
document.addEventListener("touchmove", (e) => { if (!e.target.closest(".card")) e.preventDefault(); }, { passive: false });

/** The camera sits behind my seat and backs off until the whole table fits; the preview circles the table. */
const camAt = new THREE.Vector3(), camGoal = new THREE.Vector3();
function aimCamera(dt, now) {
  const portrait = innerHeight > innerWidth * 1.1, elev = ATTRACT ? 0.74 : portrait ? 1.12 : 0.82;
  const ang = ATTRACT ? Math.PI / 2 + now / 7000 : Math.PI / 2;
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect), reach = CUP_R + 1.05; // the cups and their name tags
  const dist = Math.max(reach / Math.tan(hf), (reach * Math.sin(elev) + 1.1) / Math.tan(vf)) + (ATTRACT ? 1.0 : 2.2);
  camGoal.set(Math.cos(ang) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.sin(ang) * Math.cos(elev) * dist);
  if (!camAt.lengthSq()) camAt.copy(camGoal);
  camAt.lerp(camGoal, Math.min(1, dt * 4));
  camera.position.copy(camAt); camera.lookAt(0, ATTRACT ? 0.5 : portrait ? -1.2 : -0.7, 0);
  scene.fog.near = dist * 0.9; scene.fog.far = dist * 2.6;
}
/** Colors already in use: other players', and the bots' at the table. */
function takenColors() {
  const g = game(), bots = g && seatOf(g, net.sessionId) < 0 ? g.seats.filter((s) => s.b).map((s) => s.c) : [];
  return new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...bots]);
}
/** Two people joined at once in one color, or mine is a bot's: pick a free one (the later sessionId moves). */
function fixColor() {
  const g = game(), others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  const clash = others.some(([id, p]) => p.c === myColor && id < net.sessionId) || (g && seatOf(g, net.sessionId) < 0 && g.seats.some((s) => s.b && s.c === myColor));
  if (!clash) return;
  const taken = takenColors(), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}
/** ?attract: nobody to wait for, so my seat (none) is skipped and the camera circles the bots. */
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; stopHosting(); } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the table meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else stopHosting();
  const g = game();
  if (g) {
    if (sentT && sentT === g.id + ":" + g.t && performance.now() - sentAt > 4000) sentT = ""; // an intent lost in a host change: let me act again
    readMyDice(g); resendDice(g, now); effects(g, now); syncTable(g, now, dt);
    if (now - lastHud > 100) { lastHud = now; hud(g); }
  }
  aimCamera(dt, now);
  lamp.intensity = 190 * (0.96 + Math.sin(now / 900) * 0.03 + Math.sin(now / 137) * 0.01);
  renderer.render(scene, camera);
  drawFx(dt);
}

(async function start() {
  if (ATTRACT) { Object.assign(CONFIG, { rollMs: 650, botMs: [420, 700], revealMs: 2300, overMs: 2500, botDoubt: 0.42 }); $("name").style.display = "none"; }
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["bid", "liar", "again"]) net.on(type, (data, from) => { if (isHost() && data) host.inbox.push({ type, from, data }); });
  net.on("mydice", (d, from) => { // a player re-sending its dice to me, the new host
    const g = game(), i = g && d ? seatOf(g, from) : -1;
    if (i < 0 || d.to !== net.sessionId || d.g !== g.id || d.r !== g.r || host.ready) return;
    Seal.open(pkOf(from), d.box).then((dice) => { if (Array.isArray(dice)) host.known.set(i, dice); });
  });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = takenColors();
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  const pk = await Seal.init().catch(() => "");
  net.me.set({ n: myName, c: myColor, pk, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
